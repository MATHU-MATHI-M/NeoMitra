<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" opacity="0.1" />
  
  <!-- Mother Figure -->
  <g transform="translate(300, 200) scale(1.2)">
    <!-- Head -->
    <circle cx="0" cy="-60" r="30" fill="#ffffff" />
    
    <!-- Body -->
    <path d="M-30 -30 Q0 40 30 -30" stroke="#ffffff" stroke-width="5" fill="#ffffff" fill-opacity="0.8" />
    
    <!-- Arms -->
    <path d="M-30 -20 Q-60 0 -45 30" stroke="#ffffff" stroke-width="5" fill="none" />
    <path d="M30 -20 Q60 0 45 30" stroke="#ffffff" stroke-width="5" fill="none" />
    
    <!-- Baby Bump -->
    <ellipse cx="0" cy="0" rx="35" ry="40" fill="#ffffff" fill-opacity="0.7" />
    
    <!-- Baby Silhouette -->
    <ellipse cx="0" cy="0" rx="20" ry="25" fill="#ffffff" fill-opacity="0.4" />
  </g>
  
  <!-- Health Icons - Heart -->
  <g transform="translate(100, 100) scale(0.6)">
    <path d="M0,30 C30,-10 70,0 70,30 C70,60 40,90 0,100 C-40,90 -70,60 -70,30 C-70,0 -30,-10 0,30 Z" fill="#ffffff" fill-opacity="0.7" />
  </g>
  
  <!-- Health Icons - Medical Cross -->
  <g transform="translate(500, 100) scale(0.6)">
    <rect x="-15" y="-50" width="30" height="100" fill="#ffffff" fill-opacity="0.7" />
    <rect x="-50" y="-15" width="100" height="30" fill="#ffffff" fill-opacity="0.7" />
  </g>
  
  <!-- Abstract Decorative Elements -->
  <circle cx="150" cy="320" r="30" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="450" cy="320" r="40" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="90" cy="250" r="20" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="510" cy="250" r="25" fill="#ffffff" fill-opacity="0.2" />
  
  <!-- Decorative Lines -->
  <path d="M50 350 Q300 320 550 350" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3" />
  <path d="M50 330 Q300 370 550 330" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3" />
</svg>